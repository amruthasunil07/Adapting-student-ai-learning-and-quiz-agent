# Netlify Configuration for Adapting Student AI Learning and Quiz Agent

[build]
  base = "frontend"
  publish = "dist"
  command = "npm run build"

# React Router single-page application rewrite rule
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Recommended security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
